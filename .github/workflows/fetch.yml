name: Fetch

on:
  workflow_dispatch:
  schedule:
    # UTC  = 21:13（北京时间约 5:13）
    - cron: '13 21 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'

# 允许 Actions 写回仓库
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 迁出代码
        uses: actions/checkout@v4
        with:
          # 必须拿到可写 token，后面才能 push
          token: ${{ secrets.GITHUB_TOKEN }}
          # 若默认分支不是 master，改成你的默认分支名
          ref: master

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行任务
        run: python ./fetch.py

      - name: 提交更改
        id: commit
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin master || git pull origin master

          git add list* snippets/ || true

          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "没有文件变更，跳过提交"
          else
            git commit -m "$(date '+%Y-%m-%d %H:%M:%S') 抓取节点"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送更改
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master

      - name: 计算要清除缓存的文件
        if: steps.commit.outputs.changed == 'true'
        id: purge_urls
        run: |
          sleep 5
          baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
          urls=""
          for f in $(find snippets -name "*.yml" -type f 2>/dev/null); do
            urls+="${baseUrl}/${f},"
          done
          for f in $(find . -name "list*" -type f -maxdepth 1 2>/dev/null); do
            urls+="${baseUrl}/${f},"
          done
          echo "urls=${urls%,*}" >> $GITHUB_OUTPUT

      - name: 清除 JsDelivr CDN 缓存（批量，一次请求）
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          json='{"path":['
          sep=''
          IFS=',' read -ra urls <<< "${{ steps.purge_urls.outputs.urls }}"
          for u in "${urls[@]}"; do
            [ -z "$u" ] && continue
            json+="$sep\"$u\""
            sep=','
          done
          json+=']}'
          curl -sf --max-time 30 -X POST "https://purge.jsdelivr.net/" \
            -H "Content-Type: application/json" -d "$json" \
            || echo "清除失败(可忽略，jsDelivr 12 小时内会自动刷新)"
